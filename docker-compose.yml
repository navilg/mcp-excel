version: '3.8'

services:
  mcp-excel-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-excel-server
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    command: python server.py --transport http --host 0.0.0.0 --port 8000
    volumes:
      - ./excel_files:/app/excel_files
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
